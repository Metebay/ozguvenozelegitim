<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Özel Özgüven Eğitim ve Rehabilitasyon Merkezi - Çok Yakında</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            background-color: #000;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Arka Plan Hareketli Işıklar */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: #4f46e5;
            top: -50px;
            left: -50px;
        }

        .blob-2 {
            width: 250px;
            height: 250px;
            background: #ec4899;
            bottom: 0;
            right: 0;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 200px;
            height: 200px;
            background: #0ea5e9;
            top: 30%;
            left: 20%;
            animation: float2 12s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        @keyframes float2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-20px, 40px) rotate(20deg); }
        }

        /* Glassmorphism Kartı */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-bar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 640px) {
            .blob { filter: blur(40px); opacity: 0.4; }
            .glass-card { backdrop-filter: blur(10px); }
        }
    </style>
</head>
<body class="flex flex-col relative justify-between">

    <!-- Hareketli Arka Plan -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3 hidden md:block"></div>

    <!-- Ana İçerik Alanı -->
    <div class="flex-grow flex items-center justify-center relative z-10 p-4 w-full">
        
        <div class="glass-card p-6 md:p-12 rounded-2xl md:rounded-3xl text-center w-full max-w-4xl mx-auto my-auto">
            
            <!-- Logo Alanı -->
            <div class="mb-6 md:mb-8 flex justify-center">
                <!-- Eğer resim bulunamazsa yerine ikon gösterir (onerror) -->
                <img src="özgüvenweb.png" 
                     onerror="this.style.display='none'; document.getElementById('placeholder-icon').style.display='block';"
                     alt="Özel Özgüven Logo" 
                     class="w-32 sm:w-40 md:w-48 h-auto object-contain drop-shadow-2xl rounded-xl animate-pulse">
                
                <!-- Resim Yüklenmezse Görünecek Placeholder -->
                <div id="placeholder-icon" style="display:none;" class="text-orange-500">
                    <i class="fas fa-sun fa-4x animate-spin-slow"></i>
                </div>
            </div>

            <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 text-xs md:text-sm font-medium mb-4 md:mb-6 animate-pulse">
                YAPIM AŞAMASINDA
            </div>

            <!-- Kurum İsmi -->
            <h1 class="font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-300 leading-tight">
                <span class="block text-3xl sm:text-5xl md:text-6xl mb-1 sm:mb-2">ÖZEL ÖZGÜVEN</span>
                <span class="block text-xl sm:text-3xl md:text-4xl font-semibold text-gray-300">EĞİTİM VE REHABİLİTASYON MERKEZİ</span>
            </h1>
            
            <p class="text-gray-400 text-sm sm:text-base md:text-xl mt-4 mb-8 md:mb-10 font-light px-2 max-w-2xl mx-auto">
                Web sitemiz yapım aşamasındadır. Çok yakında hizmetinizdeyiz.
            </p>

            <!-- Geri Sayım Sayacı -->
            <div class="grid grid-cols-4 gap-2 md:gap-4 mb-8 md:mb-10 max-w-2xl mx-auto">
                <div class="timer-box rounded-lg md:rounded-xl p-2 md:p-4">
                    <div id="days" class="text-xl sm:text-2xl md:text-4xl font-bold">00</div>
                    <div class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wider">Gün</div>
                </div>
                <div class="timer-box rounded-lg md:rounded-xl p-2 md:p-4">
                    <div id="hours" class="text-xl sm:text-2xl md:text-4xl font-bold">00</div>
                    <div class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wider">Saat</div>
                </div>
                <div class="timer-box rounded-lg md:rounded-xl p-2 md:p-4">
                    <div id="minutes" class="text-xl sm:text-2xl md:text-4xl font-bold">00</div>
                    <div class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wider">Dak</div>
                </div>
                <div class="timer-box rounded-lg md:rounded-xl p-2 md:p-4">
                    <div id="seconds" class="text-xl sm:text-2xl md:text-4xl font-bold text-pink-500">00</div>
                    <div class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wider">San</div>
                </div>
            </div>

            <!-- İletişim Butonu -->
            <a href="mailto:info@ozguvenegitim.com" class="inline-flex items-center gap-2 bg-white text-black px-8 py-3 rounded-full text-sm md:text-base font-bold hover:bg-gray-200 transition-colors shadow-lg hover:shadow-white/20">
                <i class="far fa-envelope"></i> Bize Ulaşın
            </a>

        </div>
    </div>

    <!-- Alt Bilgi / Footer -->
    <div class="footer-bar relative z-10 py-4 px-4 md:px-12 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
        
        <!-- Güncellenen Bayındır Medya Yazısı -->
        <div class="text-gray-400 text-xs md:text-sm flex flex-col md:flex-row items-center gap-1 flex-wrap justify-center md:justify-start">
            <span>Bu işletmenin dijital dönüşümü</span>
            <a href="https://bayindirmedya.com" target="_blank" class="flex items-center gap-1 text-white font-semibold hover:text-indigo-400 transition-colors">
                 Bayındır Medya
            </a>
            <span>tarafından yapılmaktadır.</span>
        </div>

        <div class="flex items-center gap-6 mt-2 md:mt-0">
            <a href="https://instagram.com/bayindirmedya" target="_blank" class="social-link text-white hover:text-pink-500 text-xl md:text-2xl" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="social-link text-white hover:text-blue-400 text-xl md:text-2xl" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="#" class="social-link text-white hover:text-blue-600 text-xl md:text-2xl" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
    </div>

    <script>
        // Geri Sayım Mantığı - SABİT TARİH
        // Hedef: 15 Aralık 2025
        const targetDate = new Date("December 15, 2025 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
