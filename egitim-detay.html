<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Detayı - Özgüven Özel Eğitim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 40px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800">
    
    <header id="main-header" class="bg-white shadow-sm sticky top-0 z-50 transition-all duration-300"></header>

    <!-- SAYFA BAŞLIĞI -->
    <div class="bg-gradient-to-r from-orange-600 to-red-600 text-white py-20 relative overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
        <div class="container mx-auto px-4 relative z-10 text-center">
            <h1 id="page-title" class="text-3xl md:text-5xl font-extrabold mb-3 tracking-tight">Eğitim Detayı</h1>
            <div class="text-base font-medium text-orange-100 flex justify-center gap-3 items-center">
                <a href="index.html" class="hover:text-white transition border-b border-transparent hover:border-white">Anasayfa</a> 
                <span class="opacity-50">/</span> 
                <a href="index.html#hizmetler" class="hover:text-white transition border-b border-transparent hover:border-white">Hizmetler</a>
                <span class="opacity-50">/</span> 
                <span id="breadcrumb-title" class="text-yellow-300 font-bold">Detay</span>
            </div>
        </div>
    </div>

    <main class="flex-grow container mx-auto px-4 py-16">
        <div class="grid lg:grid-cols-12 gap-10">
            
            <!-- ANA İÇERİK (SOL) -->
            <div class="lg:col-span-8 animate-fade-in-up">
                <div class="bg-white rounded-[2rem] shadow-xl border border-gray-100 overflow-hidden">
                    <!-- Görsel -->
                    <div class="relative h-[400px] w-full bg-gray-100 group">
                        <img id="s-image" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                    </div>
                    
                    <!-- Metin -->
                    <div class="p-8 md:p-12">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="p-3 bg-orange-50 text-orange-600 rounded-xl">
                                <i id="s-icon" data-lucide="book-open" class="w-6 h-6"></i>
                            </div>
                            <h2 id="s-title" class="text-3xl font-extrabold text-gray-900"></h2>
                        </div>
                        
                        <div id="s-content" class="prose prose-lg prose-orange max-w-none text-gray-600 leading-loose">
                            <!-- İçerik JS ile dolacak -->
                        </div>

                        <!-- Özellikler Listesi (Örnek) -->
                        <div class="mt-10 bg-gray-50 p-8 rounded-2xl border border-gray-100">
                            <h3 class="font-bold text-xl mb-4 text-gray-900">Neler Sunuyoruz?</h3>
                            <ul class="space-y-3" id="s-features">
                                <!-- JS ile dolacak -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- YAN MENÜ (SAĞ) -->
            <div class="lg:col-span-4 space-y-8">
                
                <!-- Diğer Hizmetler -->
                <div class="bg-white p-6 rounded-2xl shadow-lg border-t-8 border-orange-500 sticky top-32">
                    <h3 class="font-bold text-xl mb-6 text-gray-900 border-b border-gray-100 pb-4">Diğer Hizmetlerimiz</h3>
                    <div id="other-services-list" class="space-y-2">
                        <!-- JS ile dolacak -->
                    </div>
                </div>

                <!-- İletişim Kartı -->
                <div class="bg-gradient-to-br from-gray-900 to-gray-800 text-white p-8 rounded-2xl shadow-xl text-center relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-orange-500/10 rounded-full -mr-10 -mt-10"></div>
                    <i data-lucide="phone-call" class="w-10 h-10 text-orange-500 mx-auto mb-4"></i>
                    <h4 class="font-bold text-xl mb-2">Detaylı Bilgi Alın</h4>
                    <p class="text-gray-400 text-sm mb-6">Uzmanlarımız sorularınızı yanıtlamak için sizi bekliyor.</p>
                    <a href="tel:02125550000" class="block w-full py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-bold transition shadow-lg shadow-orange-900/20">
                        Hemen Arayın
                    </a>
                </div>

            </div>
        </div>
    </main>

    <footer id="main-footer" class="bg-gray-900 mt-auto"></footer>
    
    <script type="module" src="js/app.js"></script>
    <script>
        // Sayfa yüklendiğinde verileri doldur
        window.addEventListener('load', () => {
            // LocalStorage'dan veriyi al
            const data = JSON.parse(localStorage.getItem('currentService'));
            
            // Eğer veri yoksa anasayfaya at
            if(!data) {
                window.location.href = 'index.html';
                return;
            }

            // İçeriği Doldur
            document.getElementById('page-title').innerText = data.title;
            document.getElementById('breadcrumb-title').innerText = data.title;
            document.getElementById('s-title').innerText = data.title;
            document.getElementById('s-content').innerHTML = `<p>${data.description}</p>`;
            document.getElementById('s-image').src = data.image;
            
            // İkonu ayarla (Lucide icons tekrar render edilmeli)
            // Not: Dinamik ikon değişimi zor olduğu için genel ikon bırakıyoruz veya JS tarafında halledilebilir.
            
            // Özellikleri Doldur
            const featureList = document.getElementById('s-features');
            if(data.features && data.features.length > 0) {
                featureList.innerHTML = data.features.map(f => `
                    <li class="flex items-start gap-3 text-gray-600">
                        <i data-lucide="check-circle" class="w-5 h-5 text-green-500 shrink-0 mt-1"></i>
                        <span>${f}</span>
                    </li>
                `).join('');
            } else {
                featureList.innerHTML = '<li class="text-gray-500">Genel eğitim programı uygulanmaktadır.</li>';
            }

            // Diğer Hizmetleri Listele (App.js içindeki window.servicesData'yı kullanacağız)
            // Bu kısım app.js yüklendikten sonra çalışmalı, bu yüzden basit bir timeout veya app.js içine entegre edilebilir.
            // Şimdilik basitçe manuel linkler ekleyelim veya app.js'in global değişkenini bekleyelim.
            setTimeout(() => {
                if(window.servicesData) {
                    const otherList = document.getElementById('other-services-list');
                    const others = window.servicesData.filter(s => s.id !== data.id);
                    otherList.innerHTML = others.map(s => `
                        <button onclick="goToServiceDetail('${s.id}')" class="w-full text-left p-3 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-700 font-medium transition flex items-center justify-between group">
                            ${s.title}
                            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-orange-500"></i>
                        </button>
                    `).join('');
                    lucide.createIcons(); // Yeni eklenen ikonları render et
                }
            }, 500);
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
