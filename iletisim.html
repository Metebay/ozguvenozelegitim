<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Özgüven Özel Eğitim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Roboto', sans-serif; overflow-x: hidden; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800">
    
    <header id="main-header" class="bg-white shadow-md sticky top-0 z-50"></header>

    <!-- SAYFA BAŞLIĞI (Canlı Gradient) -->
    <div class="bg-gradient-to-r from-orange-600 to-red-600 text-white py-16 relative overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
        <div class="container mx-auto px-4 relative z-10 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-2">İletişim</h1>
            <div class="text-sm font-medium text-orange-100 mt-2 flex justify-center gap-2 items-center">
                <a href="index.html" class="hover:text-white transition border-b border-transparent hover:border-white">Anasayfa</a> 
                <span class="opacity-50">/</span> 
                <span class="text-yellow-300">Bize Ulaşın</span>
            </div>
        </div>
    </div>

    <main class="flex-grow container mx-auto px-4 py-16">
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16">
            <!-- Sol: İletişim Bilgileri & Harita -->
            <div class="space-y-10">
                <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl border-t-8 border-orange-500">
                    <h2 class="text-2xl font-extrabold text-gray-900 mb-8">İletişim Bilgileri</h2>
                    <div class="space-y-8">
                        <div class="flex items-start gap-5 group">
                            <div class="bg-orange-100 p-4 rounded-xl text-orange-600 group-hover:bg-orange-600 group-hover:text-white transition-colors duration-300 shadow-sm"><i data-lucide="map-pin" class="w-6 h-6"></i></div>
                            <div>
                                <h4 class="font-bold text-sm text-gray-400 uppercase tracking-widest mb-1">Adres</h4>
                                <p class="text-gray-800 text-lg font-medium">Merkez Mah. Eğitim Cad. No:1<br>Bağcılar / İstanbul</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-5 group">
                            <div class="bg-orange-100 p-4 rounded-xl text-orange-600 group-hover:bg-orange-600 group-hover:text-white transition-colors duration-300 shadow-sm"><i data-lucide="phone" class="w-6 h-6"></i></div>
                            <div>
                                <h4 class="font-bold text-sm text-gray-400 uppercase tracking-widest mb-1">Telefon</h4>
                                <p class="text-gray-800 text-lg font-medium hover:text-orange-600 transition">0 (212) 555 00 00</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-5 group">
                            <div class="bg-orange-100 p-4 rounded-xl text-orange-600 group-hover:bg-orange-600 group-hover:text-white transition-colors duration-300 shadow-sm"><i data-lucide="mail" class="w-6 h-6"></i></div>
                            <div>
                                <h4 class="font-bold text-sm text-gray-400 uppercase tracking-widest mb-1">E-Posta</h4>
                                <p class="text-gray-800 text-lg font-medium hover:text-orange-600 transition">bilgi@ozguvenegitim.com</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Harita Placeholder -->
                <div class="bg-gray-200 h-80 rounded-3xl shadow-inner flex items-center justify-center text-gray-400 border border-gray-300 overflow-hidden relative group">
                    <div class="absolute inset-0 bg-gray-300 opacity-0 group-hover:opacity-20 transition-opacity"></div>
                    <div class="text-center">
                        <i data-lucide="map" class="w-16 h-16 mx-auto mb-3 opacity-50 group-hover:scale-110 transition-transform"></i>
                        <span class="font-bold text-lg">Google Maps Alanı</span>
                    </div>
                </div>
            </div>

            <!-- Sağ: İletişim Formu -->
            <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl border border-gray-100 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-40 h-40 bg-orange-50 rounded-bl-full -mr-10 -mt-10 pointer-events-none"></div>
                
                <h2 class="text-3xl font-extrabold text-gray-900 mb-3 relative z-10">Bize Mesaj Gönderin</h2>
                <p class="text-gray-500 mb-8 text-lg relative z-10">Formu doldurun, en kısa sürede uzman ekibimiz sizinle iletişime geçsin.</p>
                
                <form onsubmit="handleContact(event)" class="space-y-6 relative z-10">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Adınız Soyadınız</label>
                        <input id="contact-name" type="text" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition font-medium" placeholder="Ad Soyad" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Telefon Numaranız</label>
                        <input id="contact-phone" type="tel" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition font-medium" placeholder="05XX XXX XX XX" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Mesajınız</label>
                        <textarea id="contact-message" rows="5" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition font-medium" placeholder="Size nasıl yardımcı olabiliriz?" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white py-4 rounded-xl font-bold transition shadow-lg shadow-orange-200 hover:shadow-orange-300 uppercase tracking-widest text-sm transform hover:-translate-y-1">Mesajı Gönder</button>
                </form>
            </div>
        </div>
    </main>

    <footer id="main-footer" class="bg-gray-900 mt-auto"></footer>
    <script type="module" src="js/app.js"></script>
</body>
</html>
